<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ab8ff"/>
      <stop offset="1" stop-color="#1746c9"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <rect x="252" y="300" width="520" height="470" rx="72" stroke-width="44"/>
    <!-- header divider -->
    <line x1="252" y1="430" x2="772" y2="430" stroke-width="40"/>
    <!-- binder rings -->
    <line x1="392" y1="236" x2="392" y2="352" stroke-width="44"/>
    <line x1="632" y1="236" x2="632" y2="352" stroke-width="44"/>
    <!-- day cells -->
    <g stroke-width="26">
      <rect x="350" y="504" width="64" height="64" rx="14"/>
      <rect x="480" y="504" width="64" height="64" rx="14"/>
      <rect x="610" y="504" width="64" height="64" rx="14"/>
      <rect x="350" y="626" width="64" height="64" rx="14"/>
      <rect x="480" y="626" width="64" height="64" rx="14"/>
    </g>
  </g>
</svg>
